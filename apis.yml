aid: cooleaf
name: Cooleaf
description: >-
  Cooleaf is an employee engagement, recognition, and rewards platform built by
  ITA Group that helps HR and people leaders create lasting engagement across
  their organizations. The platform lets teams recognize peers, reward
  performance and KPIs, celebrate milestones and anniversaries, run pulse
  surveys and challenges, deliver training and programming, and surface
  engagement analytics through manager dashboards. Cooleaf meets employees where
  they already work by embedding recognition into Slack and Microsoft Teams and
  syncing people data through connectors like Zapier and Workday. Cooleaf is
  delivered as a closed SaaS product with a hosted web application and login;
  it does not publish a public developer API, SDKs, or API reference, so this
  API Evangelist profile captures its identity, domain-security posture, and
  the integration surface it exposes to customers rather than a developer
  program.
